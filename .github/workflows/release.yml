name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel contents
        run: |
          WHEEL=$(ls dist/*.whl)
          python3 -c "
          import zipfile, sys, os
          wheel = os.environ['WHEEL']
          z = zipfile.ZipFile(wheel)
          names = sorted(z.namelist())
          for n in names:
              print(n)
          bad = [n for n in names if any(x in n for x in ['cv_variants','/profile/','cv_profile','application_templates','cv_template','scripts/'])]
          if bad:
              print(f'LEAKED: {bad}', file=sys.stderr)
              sys.exit(1)
          print('Wheel audit: CLEAN')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
