name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile Python
        run: PYTHONPATH=src:. uv run -- python3 -m py_compile $(find src tests scripts -name '*.py')

      - name: Test
        run: PYTHONPATH=src:. uv run -- python3 -m pytest -q tests/

      - name: Lock check
        run: uv lock --check

      - name: Diff check
        run: git diff --check
